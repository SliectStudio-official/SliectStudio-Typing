<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>打字比赛 - Typing</title>
  <script src="page-loading.js"></script>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#c96442">
</head>
<body data-page="race">
  <div id="site-nav"></div>

  <div class="sub-nav race-sub-nav">
    <div class="section-name" id="page-title">比赛大厅</div>
    <div class="race-subnav-center" id="race-subnav-center" style="display:none">
      <span class="race-code-chip" id="race-code-chip"></span>
    </div>
    <div class="race-subnav-actions" id="race-subnav-actions">
      <button class="race-btn race-btn-small race-btn-danger" id="btn-dissolve-race" style="display:none">发起解散投票</button>
      <button class="race-btn race-btn-small race-btn-danger" id="btn-exit-race" style="display:none">退出比赛</button>
    </div>
  </div>

  <div class="container">

    <div class="race-reconnect-banner" id="race-reconnect-banner" style="display:none">连接中断，正在重试…</div>

    <!-- 大厅 -->
    <section id="view-lobby">
      <div class="section-card quick-match-card" id="quick-match-card">
        <div class="section-card-title">快速匹配</div>
        <p class="race-hint" id="quick-match-hint">随机文章 1v1，凑齐两人自动开始；匹配状态显示在屏幕底部。</p>
        <button class="race-btn race-btn-primary" id="btn-quick-match" style="display:none">快速匹配</button>
      </div>

      <div class="race-grid">
        <div class="section-card">
          <div class="section-card-title">创建房间</div>
          <p class="race-hint" id="create-hint">登录后可创建房间；未登录也能用房间码+密码加入别人的比赛。</p>
          <div class="race-form">
            <label>文章
              <select id="create-article" class="race-input"></select>
            </label>
            <label>房间密码（4 位数字）
              <input id="create-password" class="race-input" inputmode="numeric" maxlength="4" placeholder="例如 1234">
            </label>
            <label>人数上限
              <div class="race-max-control">
                <input id="create-max" class="race-input race-max-input" type="number" min="2" max="100" step="1" value="8">
                <div class="race-max-quick" id="create-max-quick">
                  <button type="button" class="race-max-quick-btn" data-max="2">2</button>
                  <button type="button" class="race-max-quick-btn" data-max="4">4</button>
                  <button type="button" class="race-max-quick-btn" data-max="8">8</button>
                  <button type="button" class="race-max-quick-btn" data-max="16">16</button>
                  <button type="button" class="race-max-quick-btn" data-max="32">32</button>
                  <button type="button" class="race-max-quick-btn" data-max="64">64</button>
                  <button type="button" class="race-max-quick-btn" data-max="100">100</button>
                </div>
              </div>
              <span class="race-max-hint" id="create-max-hint">2–100 人，观战席自动为约 10%</span>
            </label>
            <label>房间最长时长
              <select id="create-duration" class="race-input">
                <option value="30">30 分钟</option>
                <option value="60" selected>60 分钟</option>
                <option value="120">120 分钟</option>
                <option value="180">180 分钟</option>
              </select>
            </label>
            <label class="race-checkbox"><input type="checkbox" id="create-public" checked> 公开房间（出现在大厅列表）</label>
            <button class="race-btn race-btn-primary" id="btn-create">创建比赛</button>
          </div>
        </div>

        <div class="section-card">
          <div class="section-card-title">加入房间</div>
          <div class="race-form">
            <label>房间码
              <input id="join-code" class="race-input race-input-code" maxlength="6" placeholder="6 位房间码">
            </label>
            <label>密码
              <input id="join-password" class="race-input" inputmode="numeric" maxlength="4" placeholder="4 位数字">
            </label>
            <label id="join-nickname-wrap">游客昵称（未登录时必填）
              <input id="join-nickname" class="race-input" maxlength="12" placeholder="2~12 个字符">
            </label>
            <button class="race-btn race-btn-primary" id="btn-join">加入比赛</button>
          </div>
        </div>
      </div>

      <div class="section-card">
        <div class="section-card-title">公开房间 <span class="race-count" id="list-count"></span></div>
        <div id="room-list" class="race-room-list"><div class="race-empty">加载中…</div></div>
      </div>
    </section>

    <!-- 等待大厅 -->
    <section id="view-room" style="display:none">
      <div class="section-card">
        <div class="race-wait-layout">
          <div class="race-wait-main">
            <div class="race-room-head">
              <div>
                <div class="race-code" id="room-code">------</div>
                <div class="race-hint" id="room-article"></div>
                <div class="race-hint race-remain" id="room-remain"></div>
              </div>
              <div class="race-room-actions">
                <button class="race-btn" id="btn-ready">准备</button>
                <button class="race-btn race-btn-primary" id="btn-start" style="display:none">开始比赛</button>
              </div>
            </div>
            <div class="race-players" id="room-players"></div>
            <div class="race-room-foot">
              <div class="race-hint" id="room-status"></div>
            </div>
          </div>
          <aside class="race-spectate-panel" id="race-spectate-panel">
            <div class="race-spectate-head">
              <div class="race-spectate-title">观战席 <span id="spec-seats-count">0/1</span></div>
              <div class="race-spectate-note" id="spec-mode-note"></div>
            </div>
            <div class="race-spectate-list" id="spec-list"></div>
            <div class="race-spectate-actions" id="spec-actions"></div>
            <div class="race-spectate-host" id="spec-host-controls" style="display:none">
              <label class="race-checkbox"><input type="checkbox" id="spec-enabled"> 开放观战</label>
              <div class="race-spectate-mode">
                <label class="race-checkbox"><input type="radio" name="spec-mode" id="spec-mode-free" value="free"> 自由进入</label>
                <label class="race-checkbox"><input type="radio" name="spec-mode" id="spec-mode-host" value="host"> 房主安排</label>
              </div>
              <label class="race-spectate-seats">席位数
                <input id="spec-seats-input" type="number" min="1" max="1" step="1">
              </label>
              <div class="race-hint" id="spec-cap-hint"></div>
            </div>
          </aside>
        </div>
      </div>
      <div class="section-card race-dissolve-wait" id="race-dissolve-wait" style="display:none"></div>
    </section>

    <!-- 匹配成功：系统抽文 -->
    <section id="view-reveal" style="display:none">
      <div class="section-card race-reveal-wrap">
        <div class="race-reveal-kicker">匹配成功</div>
        <div class="race-reveal-sub">系统正在为你抽取文章</div>
        <div class="race-reveal-stage" id="race-reveal-candidates"></div>
      </div>
    </section>

    <!-- 比赛中 -->
    <section id="view-race" style="display:none">
      <div class="race-stage">
        <aside class="race-side">
          <div class="race-side-block">
            <div class="race-side-label">文章</div>
            <div class="race-side-title" id="race-article"></div>
            <div class="race-side-meta" id="race-meta"></div>
          </div>
          <div class="race-side-block">
            <div class="race-side-label">当前排名</div>
            <div id="race-rank" class="race-rank"></div>
          </div>
          <div class="race-side-block">
            <div class="race-side-label">我的进度</div>
            <div class="race-mine" id="race-mine"></div>
          </div>
          <div class="race-side-block" id="race-spectator-live">
            <div class="race-side-label">观战席</div>
            <div class="race-side-meta" id="race-spectator-live-count"></div>
            <div class="race-mine" id="race-spectator-live-list"></div>
          </div>
          <div class="race-side-block race-dissolve-block" id="race-dissolve-block" style="display:none"></div>
        </aside>
        <div class="race-main">
          <div class="race-fx-overtake" id="race-overtake" style="display:none"></div>
          <div class="race-fx-combo" id="race-combo" style="display:none">连击 ×0</div>
          <div class="race-fx-sprint" id="race-sprint" style="display:none">冲刺</div>
          <div class="race-countdown" id="race-countdown" style="display:none"></div>
          <div class="race-typing-hint" id="race-typing-hint">点击下方输入框开始打字，输完一行自动翻到下一行</div>
          <div id="race-typing" class="typing-pages"></div>
        </div>
      </div>
    </section>

    <!-- 观战（导播台） -->
    <section id="view-spectate" style="display:none">
      <div class="race-stage">
        <aside class="race-side">
          <div class="race-side-block">
            <div class="race-side-label">导播焦点</div>
            <div class="race-side-title" id="spec-focus-name">—</div>
            <div class="race-side-meta" id="spec-focus-meta"></div>
            <div class="race-mine" id="spec-focus-stats" style="margin-top:8px"></div>
            <div class="race-mini-line race-mini-focus" id="spec-focus-mini" style="display:none"></div>
          </div>
          <div class="race-side-block">
            <div class="race-side-label">比赛信息</div>
            <div class="race-side-title" id="spec-article"></div>
            <div class="race-side-meta" id="spec-meta"></div>
          </div>
          <div class="race-side-block">
            <div class="race-side-label">观战席</div>
            <div class="race-mine" id="spec-audience"></div>
          </div>
          <div class="race-side-block race-dissolve-block" id="race-dissolve-spectate" style="display:none"></div>
        </aside>
        <div class="race-main">
          <div class="race-side-label" style="margin-bottom:12px">全场实时战况</div>
          <div id="spec-board" class="race-board"></div>
        </div>
      </div>
    </section>

    <!-- 结算 -->
    <section id="view-result" style="display:none">
      <div class="section-card">
        <div class="section-card-title">比赛结果</div>
        <div id="result-list" class="race-result"></div>
        <div class="race-room-actions" style="margin-top:16px">
          <button class="race-btn race-btn-primary" id="btn-back-lobby">返回大厅</button>
          <button class="race-btn" id="btn-leave2">离开房间</button>
        </div>
      </div>
    </section>

  </div>

  <div id="race-toast" class="race-toast" style="display:none"></div>

  <!-- 解散比赛二次确认 -->
  <div class="modal-overlay race-exit-overlay" id="race-dissolve-overlay" style="display:none">
    <div class="modal confirm-modal" role="dialog" aria-modal="true" aria-labelledby="race-dissolve-title">
      <h3 id="race-dissolve-title">解散比赛</h3>
      <p id="race-dissolve-text"></p>
      <div class="btn-group">
        <button class="btn-secondary" id="race-dissolve-cancel">取消</button>
        <button class="btn-primary race-btn-danger" id="race-dissolve-confirm">发起解散</button>
      </div>
    </div>
  </div>

  <!-- 退出比赛二次确认 -->
  <div class="modal-overlay race-exit-overlay" id="race-exit-overlay" style="display:none">
    <div class="modal confirm-modal" role="dialog" aria-modal="true" aria-labelledby="race-exit-title">
      <h3 id="race-exit-title">退出比赛</h3>
      <p id="race-exit-text"></p>
      <div class="btn-group">
        <button class="btn-secondary" id="race-exit-cancel">取消</button>
        <button class="btn-primary race-btn-danger" id="race-exit-confirm">退出</button>
      </div>
    </div>
  </div>

  <!-- 全屏开赛倒计时（手动房与快速匹配共用） -->
  <div class="race-countdown-overlay" id="race-countdown-overlay" style="display:none" role="dialog" aria-modal="true" aria-label="比赛即将开始">
    <div class="race-countdown-card">
      <div class="race-countdown-label">即将开始</div>
      <div class="race-countdown-title" id="race-countdown-title"></div>
      <div class="race-countdown-meta" id="race-countdown-meta"></div>
      <div class="race-countdown-number" id="race-countdown-number">3</div>
      <div class="race-countdown-hint">倒计时结束后自动开始打字</div>
    </div>
  </div>
  <script src="nav.js"></script>
  <script src="announcement-bar.js"></script>
  <script src="typing-engine.js"></script>
  <script src="theme-toggle.js"></script>
  <script src="race.js"></script>
</body>
</html>
