<title>首页仪表盘 · Figma 设计稿还原（1920×1080）</title>
<!--
  用途：把 Figma 设计稿「Typing / Main」(file 0BxzVHZOqko0tLFAL4nELu) 还原成可查看、可点两下的 HTML。
  覆盖两个画板：
    · 首页      frame 1:2   「Main」1920×1080
    · 正在匹配  frame 10:111 「Main-正在匹配」1920×1080（与首页相比只差「快速开始」卡片变体 + 底部 SOLO 匹配状态条）
  数据来源：Figma REST API files/:key/nodes?ids=…&depth=20，读取时间 2026-11-07，
            文件 lastModified 2026-11-06T20:27:32Z；快照 tmp/figma/main-20261106T2027.json、tmp/figma/states-20261107.json。
  资源：背景照片与全部图标由 Figma images 端点导出（design/assets/bg-photo.jpg + 内联 SVG）。
  这不是生产页面：不连接 server.js 的任何接口，也没有改动 public/ 下任何文件。
-->
<style>
  /* ===== 设计令牌（逐项取自 Figma 节点数据） ===== */
  :root{
    --glass-fill-5: rgba(255, 255, 255, 0.05);   /* 动作卡 / 资料卡 / 状态条（节点 4:5、I10:285;4:57、I10:209;10:4） */
    --glass-fill-10: rgba(255, 255, 255, 0.10);  /* 统计卡与链接行（节点 I10:285;4:70 等） */
    /* 1px 描边 GRADIENT_LINEAR（竖直 0→1）：#999999 → 15% 透明 → 85% 透明 → 25% #ffffff */
    --hairline: linear-gradient(180deg,
      rgba(153, 153, 153, 1) 0%,
      rgba(153, 153, 153, 0) 15%,
      rgba(255, 255, 255, 0) 85%,
      rgba(255, 255, 255, 0.25) 100%);
    --danger: #ff1d1d;
    --danger-fill: rgba(255, 29, 29, 0.1);
    --match-blue: #444aff;                        /* 正在匹配状态的卡片（节点 I10:272;10:260） */
    --match-fill: rgba(68, 74, 255, 0.2);
    --shadow-1: 0 4px 5px 0 rgba(0, 0, 0, 0.15);  /* DROP_SHADOW 0 4 5 rgba(0,0,0,.15) */
    --shadow-2: 0 4px 15px 5px rgba(0, 0, 0, 0.35); /* DROP_SHADOW 0 4 15 spread 5 rgba(0,0,0,.35) */

    --text-100: #ffffff;
    --text-50: rgba(255, 255, 255, 0.5);
    --text-10: rgba(255, 255, 255, 0.1);

    --fs-48: 48px;  --lh-48: 56.256px;
    --fs-32: 32px;  --lh-32: 37.504px;
    --fs-24: 24px;  --lh-24: 28.128px;
    --fs-20: 20px;  --lh-20: 23.44px;
    --fs-15: 15px;  --lh-15: 17.58px;

    /* 设计稿字体是 OPPO Sans 4.0，Windows 默认没有，见 design/README.md 偏差 D1 */
    --font: "OPPO Sans 4.0", "OPPO Sans", "HarmonyOS Sans SC", "Microsoft YaHei UI", "Microsoft YaHei", system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%; overflow: hidden; background: #05070d;
    font-family: var(--font); -webkit-font-smoothing: antialiased;
  }

  /* 固定 1920×1080 画布，等比缩放居中：任何屏幕上看到的都是同一张稿 */
  #viewport { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #stage {
    position: relative; flex: 0 0 auto;
    width: 1920px; height: 1080px;
    overflow: hidden; background: #05070d;
    transform-origin: center center;
  }

  /* ===== 背景层（节点 2:2 / 4:103） ===== */
  .bg-photo {
    position: absolute; left: 0; top: 0;
    width: 1920px; height: 1081px;
    background: url("assets/bg-photo.jpg") center / cover no-repeat;
  }
  .panel-gradient {
    position: absolute; left: 1065px; top: 0;
    width: 855px; height: 1081px;
    background: linear-gradient(90deg,
      rgba(0, 0, 0, 0) 0%,
      rgba(0, 0, 0, 0.5) 35.096%,
      rgba(0, 0, 0, 1) 100%);
  }

  /* 玻璃面：1px 渐变描边用 mask 抠环，因为 border 无法承载渐变 */
  .glass { position: relative; box-shadow: var(--shadow-1); }
  .glass::before {
    content: ""; position: absolute; inset: 0; border-radius: inherit;
    padding: 1px; background: var(--hairline);
    -webkit-mask: linear-gradient(#000, #000) content-box, linear-gradient(#000, #000);
    -webkit-mask-composite: xor;
    mask: linear-gradient(#000, #000) content-box, linear-gradient(#000, #000);
    mask-composite: exclude;
    pointer-events: none;
  }

  /* ===== 左上角：进入首页（节点 6:167） ===== */
  .home-link {
    position: absolute; left: 120px; top: 122px; height: 28px;
    display: flex; align-items: center; gap: 10px;
    color: var(--text-100); text-decoration: none; cursor: pointer;
    font-size: var(--fs-24); line-height: var(--lh-24); font-weight: 400;
  }
  .home-link svg { display: block; width: 20px; height: 20px; margin-top: 4px; }

  /* ===== 左栏欢迎区（节点 4:6） ===== */
  .greeting { position: absolute; left: 120px; top: 306px; font-size: var(--fs-32); line-height: var(--lh-32); font-weight: 400; color: var(--text-100); }
  .username { position: absolute; left: 120px; top: 359px; font-size: var(--fs-48); line-height: var(--lh-48); font-weight: 600; color: var(--text-100); }

  /* ===== 左栏三张动作卡（节点 4:51，425×100，间距 15） ===== */
  .actions { position: absolute; left: 120px; top: 541px; width: 425px; }
  .action-card {
    display: block; position: relative;
    width: 425px; height: 100px; border-radius: 15px;
    background: var(--glass-fill-5);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    color: var(--text-100); text-decoration: none; cursor: pointer;
    transition: background 240ms ease;
  }
  .action-card + .action-card { margin-top: 15px; }
  .action-card:hover { background: rgba(255, 255, 255, 0.09); }  /* 交互态设计稿未给，偏差 D4 */
  .action-card .icon { position: absolute; left: 26px; top: 38px; width: 25px; height: 25px; }
  .action-card .icon svg { display: block; width: 25px; height: 25px; }
  .action-card .title { position: absolute; left: 76px; top: 22px; font-size: var(--fs-24); line-height: var(--lh-24); font-weight: 600; }
  .action-card .desc  { position: absolute; left: 76px; top: 55px; font-size: var(--fs-20); line-height: var(--lh-20); font-weight: 400; color: var(--text-50); }
  .action-card .chev  { position: absolute; left: 381px; top: 43px; width: 15px; height: 15px; }
  .action-card .chev svg { display: block; }

  /* 正在匹配时的「快速开始」卡片：节点 I10:272;10:260
     填充 #444aff 20%、描边纯色 #444aff、右侧箭头换成关闭图标（点击卡片任意位置 = 取消） */
  .action-card .match-only { display: none; }
  .action-card.is-matching { background: var(--match-fill); }
  .action-card.is-matching:hover { background: rgba(68, 74, 255, 0.28); }  /* 匹配中悬停提示「可取消」，偏差 D4 */
  .action-card.is-matching::before { background: var(--match-blue); }
  .action-card.is-matching .idle-only { display: none; }
  .action-card.is-matching .match-only { display: block; }
  .action-card.is-matching .match-close {
    position: absolute; left: 377px; top: 39px; width: 21px; height: 21px;
  }
  .action-card.is-matching .match-close svg { display: block; }

  /* ===== 左下角版本号（节点 4:49） ===== */
  .version { position: absolute; left: 120px; top: 942px; font-size: var(--fs-15); line-height: var(--lh-15); font-weight: 400; color: var(--text-10); }

  /* ===== 右栏个人资料卡（节点 10:285 / 组件 10:284） ===== */
  .profile-card {
    position: absolute; left: 1250px; top: 227px;
    width: 550px; height: 627px; border-radius: 20px;
    background: var(--glass-fill-5); box-shadow: var(--shadow-2);
    backdrop-filter: blur(100px); -webkit-backdrop-filter: blur(100px);
  }
  .profile-content { position: absolute; left: 18px; top: 49px; width: 515px; height: 560px; }
  .avatar {
    position: absolute; left: 207.5px; top: 0; width: 100px; height: 100px;
    border-radius: 50%;
    background: linear-gradient(180deg, #d9d9d9 0%, #737373 100%);
    display: flex; align-items: center; justify-content: center;
    font-size: var(--fs-24); line-height: var(--lh-24); font-weight: 600; color: #000000;
  }
  .profile-name { position: absolute; left: 0; top: 115px; width: 515px; text-align: center; font-size: var(--fs-20); line-height: var(--lh-20); font-weight: 400; color: var(--text-100); }

  .stats { position: absolute; left: 0; top: 188px; width: 515px; height: 80px; display: flex; gap: 5px; }
  .stat {
    flex: 0 0 125px; height: 80px; border-radius: 15px;
    background: var(--glass-fill-10);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    display: flex; flex-direction: column; align-items: center;
  }
  .stat .value { margin-top: 12px; height: 28px; display: flex; align-items: center; gap: 5px; font-size: var(--fs-24); line-height: var(--lh-24); font-weight: 600; color: var(--text-100); }
  .stat .value svg { display: block; }
  .stat .label { margin-top: 5px; font-size: var(--fs-20); line-height: var(--lh-20); font-weight: 400; color: var(--text-100); }

  .rows { position: absolute; left: 0; top: 283px; width: 515px; }
  .row {
    display: flex; align-items: center; position: relative;
    width: 515px; height: 58px; border-radius: 15px;
    background: var(--glass-fill-10);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    color: var(--text-100); text-decoration: none; cursor: pointer;
    transition: background 120ms ease;
  }
  .row + .row { margin-top: 15px; }
  .row:hover { background: rgba(255, 255, 255, 0.16); }
  .row .label { margin-left: 16px; font-size: var(--fs-20); line-height: var(--lh-20); font-weight: 400; }
  .row .chev { position: absolute; right: 16px; top: 19px; width: 20px; height: 20px; }
  .row .chev svg { display: block; }

  .row--danger { background: var(--danger-fill); color: var(--danger); }
  .row--danger::before { background: var(--danger); }
  .row--danger:hover { background: rgba(255, 29, 29, 0.18); }
  .row--danger .chev svg path { stroke: var(--danger); }

  /* ===== 底部 SOLO 匹配状态条（节点 10:209 / 组件 10:18，1920×75 @ y=1005） =====
     出现/收起动画设计稿未给，这里用「自下而上滑入 + 淡入」320ms，见 README 偏差 D6 */
  .status-bar {
    position: absolute; left: 0; top: 1005px;
    width: 1920px; height: 75px;
    opacity: 0; transform: translateY(100%);
    pointer-events: none;
    transition: transform 320ms cubic-bezier(0.22, 0.8, 0.2, 1), opacity 240ms ease;
  }
  .status-bar.is-visible { opacity: 1; transform: translateY(0); pointer-events: auto; }
  .bar-bg {
    position: absolute; inset: 0;
    background: var(--glass-fill-5);
    border: 1px solid rgba(255, 255, 255, 0.25);   /* 描边是纯色 25%，不是渐变 */
    box-shadow: var(--shadow-2);
    backdrop-filter: blur(100px); -webkit-backdrop-filter: blur(100px);
  }
  .bar-title {
    position: absolute; left: 25px; top: 24px;
    font-size: var(--fs-24); line-height: var(--lh-24); font-weight: 600; color: var(--text-100);
  }
  .bar-timer {
    position: absolute; left: 1777px; top: 24px; width: 63px;
    font-size: var(--fs-24); line-height: var(--lh-24); font-weight: 600; color: var(--text-100);
  }
  .bar-close {
    position: absolute; left: 1860px; top: 20px;
    width: 35px; height: 35px; border-radius: 20px; border: 0; padding: 0;
    display: flex; align-items: center; justify-content: center;
    background: var(--glass-fill-5); box-shadow: var(--shadow-1);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    cursor: pointer;
  }
  .bar-close svg { display: block; }
  .bar-close:hover { background: rgba(255, 255, 255, 0.12); }
</style>
</head>

<script>
  // 只做「看稿」适配：1920×1080 画布等比缩放居中，不改任何布局数值。
  (function () {
    var stage = document.getElementById('stage');
    function fit() {
      var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
      stage.style.transform = 'scale(' + s + ')';
    }
    window.addEventListener('resize', fit);
    fit();
  })();

  // ===== 匹配状态机：idle → matching → idle =====
  // 计时是「正计时」：从进入匹配开始累计已等待时长（设计稿那帧 00:15 就是已等 15 秒，不是剩余时间）。
  // NOT IMPLEMENTED：匹配成功的判定与「进入练习页」需要后端接口，本轮不实现，所以计时会一直走。
  (function () {
    var card = document.getElementById('quickStart');
    var cardTimer = document.getElementById('cardTimer');
    var bar = document.getElementById('statusBar');
    var barTimer = document.getElementById('barTimer');
    var barClose = document.getElementById('barClose');

    var state = 'idle';
    var elapsed = 0;          // 已等待秒数
    var startedAt = 0;        // 进入匹配的时刻，用于对齐走表（切后台也不会漂）
    var tickId = null;

    function fmt(sec) {
      var m = Math.floor(sec / 60);
      var s = sec % 60;
      return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
    }
    function paint() {
      var text = fmt(elapsed);
      cardTimer.textContent = text;
      barTimer.textContent = text;
    }
    function stopTick() {
      if (tickId !== null) { clearInterval(tickId); tickId = null; }
    }
    function startMatching() {
      if (state === 'matching') return;
      state = 'matching';
      elapsed = 0;
      startedAt = Date.now();
      paint();
      card.classList.add('is-matching');
      card.setAttribute('aria-label', '正在匹配，点击取消');
      bar.classList.add('is-visible');
      tickId = setInterval(function () {
        elapsed = Math.floor((Date.now() - startedAt) / 1000);
        paint();
      }, 250);
    }
    function cancelMatching() {
      if (state !== 'matching') return;
      state = 'idle';
      stopTick();
      card.classList.remove('is-matching');
      card.removeAttribute('aria-label');
      bar.classList.remove('is-visible');
    }

    // 匹配中整张卡片都是「取消」，未匹配时点卡片是「开始匹配」
    card.addEventListener('click', function (e) {
      e.preventDefault();
      if (state === 'matching') cancelMatching();
      else startMatching();
    });
    // 状态条上的关闭按钮同样取消
    barClose.addEventListener('click', function (e) {
      e.preventDefault();
      e.stopPropagation();
      cancelMatching();
    });
  })();
</script>
